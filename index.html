<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yomple</title>
  <meta name="description" content="Play Bloom, Word Garden, Hall of Presidents, Star Map, and Quiet Field." />
  <link rel="icon" href="favicon.svg" />
  <style>
    :root{ --coral:#FF6B5A; --sun:#FFD54A; --sky:#4AA8F0; --mint:#5FCFB3; --ink:#2B2A38; --soft:#4A4860; }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%}
    body{
      font-family:"ui-rounded","Nunito","Avenir Next","Segoe UI",system-ui,sans-serif; color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #fff6a8 0 18%, transparent 42%),
        radial-gradient(circle at 92% 12%, #ffb7d5 0 16%, transparent 40%),
        radial-gradient(circle at 80% 88%, #9be7c8 0 20%, transparent 46%),
        radial-gradient(circle at 10% 82%, #8fd0ff 0 18%, transparent 44%),
        linear-gradient(180deg,#9fe7ff 0%,#ffe28a 48%,#ffb38a 100%);
      background-attachment:fixed;
    }
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#fff 1.5px, transparent 2px),radial-gradient(#fff 1px, transparent 2px);background-size:46px 46px, 22px 22px;background-position:0 0, 12px 18px;}
    a{color:inherit}
    .wrap{width:min(920px,92vw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:26px 0 32px;position:relative;z-index:1}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 4px}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;background:#fff;border-radius:999px;padding:8px 18px 8px 10px;box-shadow:0 8px 0 rgba(255,107,90,.18), 0 16px 30px rgba(43,42,56,.12)}
    .mark{width:58px;height:58px;display:block}
    .word{height:36px;display:block}
    #who-pill{border:0;background:#fff;border-radius:999px;padding:10px 16px;font:inherit;font-weight:800;box-shadow:0 8px 0 rgba(43,42,56,.08);cursor:pointer;white-space:nowrap}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:10px 0 18px}
    h1{font-size:clamp(22px,4vw,28px);font-weight:800;margin:0;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 0 rgba(43,42,56,.18);background:#ff6b5a;border-radius:999px;padding:8px 18px;}
    .apps{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:100%}
    .app{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:200px;border-radius:26px;padding:18px 16px 16px;text-decoration:none;color:#fff;box-shadow:0 10px 0 rgba(43,42,56,.12), 0 18px 28px rgba(43,42,56,.16);background-size:cover;background-position:center;transform:rotate(-0.4deg);transition:transform .15s ease;}
    .app:nth-child(2){transform:rotate(.5deg)}
    .app:nth-child(3){transform:rotate(-.2deg)}
    .app:nth-child(4){transform:rotate(.35deg)}
    .app:nth-child(5){transform:rotate(-.25deg)}
    .app:hover{transform:translateY(-3px) rotate(0)}
    .app::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,42,56,.05) 30%,rgba(43,42,56,.62) 100%);}
    .app > *{position:relative;z-index:1}
    .app .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff;font-size:24px;margin-bottom:auto;box-shadow:0 4px 0 rgba(43,42,56,.12)}
    .app h2{margin:0 0 2px;font-size:1.28rem;letter-spacing:-.03em;text-shadow:0 2px 8px rgba(0,0,0,.35)}
    .app p{margin:0;font-weight:700;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.35)}
    .bloom{background-color:#7ed56a;background-image:url("https://lh3.googleusercontent.com/d/1qo2wkH2ZE36E1NZYc6wSMOkdTVv16Myj=s900"),linear-gradient(160deg,#b6f36a,#49c27a);}
    .garden{background-color:#f4a0d2;background-image:url("https://lh3.googleusercontent.com/d/11JZb4vQLGeHEzTjnRfoTXKEn4AbDcqMQ=s900"),linear-gradient(160deg,#ff9ec8,#7ad36a);}
    .hall{background-color:#e0a14a;background-image:url("https://lh3.googleusercontent.com/d/14joT01-sGwPLZPPtvN9voXmzqjvRpdx8=s900"),linear-gradient(160deg,#f0c36a,#b8742a);}
    .stars{background-color:#2a4a8c;background-image:url("https://lh3.googleusercontent.com/d/1f6i36HgwXbnujqamAwE78tdZLntx1jhC=s900"),linear-gradient(160deg,#3d6ad4,#1a2a5a);}
    .field{background-color:#3d4a3a;background-image:url("/field/lincoln-field.svg"),linear-gradient(160deg,#7fb39a,#1c2436);background-size:cover;background-position:center 62%;}
    footer{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:13px;padding-top:6px}
    footer a{text-decoration:none;color:#2B2A38;background:#fff;border-radius:999px;padding:6px 12px;opacity:.85;font-weight:700}
    #who-sheet{position:fixed;inset:0;background:rgba(43,42,56,.35);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
    #who-sheet.open{display:flex}
    .sheet{background:#fff;width:min(440px,100%);border-radius:28px 28px 22px 22px;padding:18px 16px 16px;box-shadow:0 -12px 40px rgba(43,42,56,.2);max-height:86vh;overflow:auto}
    .sheet h2{margin:0 0 8px;font-size:1.2rem}
    .sheet label{display:block;font-size:.8rem;font-weight:800;color:var(--soft);margin:10px 0 4px}
    .sheet input{width:100%;padding:10px 12px;border-radius:12px;border:2px solid rgba(43,42,56,.1);font:inherit}
    .faces{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
    .face{border:0;background:#FFF8F1;border-radius:16px;padding:10px 12px;font:inherit;font-weight:700;cursor:pointer}
    .face.on{outline:2px solid var(--mint)}
    .face span{display:block;font-size:1.3rem}
    .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .row button,.ghost{border:0;border-radius:999px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}
    .row .go{background:var(--ink);color:#fff}
    .ghost{background:transparent;color:var(--soft)}
    .avs{display:flex;flex-wrap:wrap;gap:6px}
    .avs span{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#FFF8F1;cursor:pointer}
    .avs span.sel{outline:2px solid var(--mint)}
    #hub-code{font-size:1.3rem;font-weight:800;letter-spacing:.06em;margin:4px 0 8px}
    #hub-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;opacity:0;z-index:30;pointer-events:none}
    #hub-toast.show{opacity:1}
    @media (max-width:700px){
      .apps{grid-template-columns:1fr}
      .app,.app:nth-child(2),.app:nth-child(3),.app:nth-child(4),.app:nth-child(5){transform:none;min-height:168px}
      header{flex-wrap:wrap;justify-content:center}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/" aria-label="Yomple">
        <svg class="mark" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="40" cy="46" r="26" fill="#FFD54A"/>
          <circle cx="32" cy="42" r="4" fill="#2B2A38"/>
          <circle cx="48" cy="42" r="4" fill="#2B2A38"/>
          <path d="M32 54 q8 8 16 0" fill="none" stroke="#2B2A38" stroke-width="3" stroke-linecap="round"/>
          <circle cx="24" cy="52" r="5" fill="#FFB3A8"/>
          <circle cx="56" cy="52" r="5" fill="#FFB3A8"/>
          <line x1="34" y1="22" x2="28" y2="8" stroke="#FF6B5A" stroke-width="5" stroke-linecap="round"/>
          <circle cx="28" cy="8" r="6" fill="#FF6B5A"/>
          <line x1="46" y1="22" x2="54" y2="6" stroke="#5FCFB3" stroke-width="5" stroke-linecap="round"/>
          <circle cx="54" cy="6" r="6" fill="#5FCFB3"/>
        </svg>
        <svg class="word" viewBox="0 0 280 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="0" y="50" font-size="52" font-family="ui-rounded, Nunito, sans-serif" font-weight="800">
            <tspan fill="#FF6B5A">Y</tspan><tspan fill="#FFD54A">o</tspan><tspan fill="#4AA8F0">m</tspan><tspan fill="#5FCFB3">p</tspan><tspan fill="#FF6B5A">l</tspan><tspan fill="#4AA8F0">e</tspan>
          </text>
        </svg>
      </a>
      <button type="button" id="who-pill" onclick="openWho()">Who?</button>
    </header>
    <main>
      <h1>Pick a world</h1>
      <div class="apps">
        <a class="app bloom" data-base="https://digcgqltrlmhgmzgmvwc.supabase.co/functions/v1/bloom/" href="https://digcgqltrlmhgmzgmvwc.supabase.co/functions/v1/bloom/"><span class="ic">🌱</span><h2>Bloom</h2><p>Multiplication</p></a>
        <a class="app garden" data-base="https://digcgqltrlmhgmzgmvwc.supabase.co/functions/v1/word-garden/" href="https://digcgqltrlmhgmzgmvwc.supabase.co/functions/v1/word-garden/"><span class="ic">🌿</span><h2>Word Garden</h2><p>Spelling</p></a>
        <a class="app hall" data-base="https://dirac1974.github.io/hall-of-presidents/" href="https://dirac1974.github.io/hall-of-presidents/"><span class="ic">🏛️</span><h2>Hall of Presidents</h2><p>US presidents in order</p></a>
        <a class="app stars" data-base="https://dirac1974.github.io/star-map/" href="https://dirac1974.github.io/star-map/"><span class="ic">⭐</span><h2>Star Map</h2><p>States and capitals</p></a>
        <a class="app field" data-base="/field/" href="/field/"><span class="ic">🌾</span><h2>Quiet Field</h2><p>Recite</p></a>
      </div>
    </main>
    <footer>
      <a href="privacy.html">Privacy</a>
      <a href="support.html">Support</a>
    </footer>
  </div>

  <div id="who-sheet" onclick="if(event.target===this) closeWho()">
    <div class="sheet">
      <div id="who-kids">
        <h2>Who is playing?</h2>
        <div id="who-grid" class="faces"></div>
        <label>Use a name I already have</label>
        <input id="hub-find" type="text" placeholder="Alex" maxlength="18">
        <div class="row">
          <button class="go" type="button" onclick="hubFind()">Find</button>
          <button type="button" onclick="showWhoTab('new')">New kid</button>
          <button class="ghost" type="button" onclick="showWhoTab('parent')">Parent</button>
        </div>
      </div>
      <div id="who-new" style="display:none">
        <h2>New kid</h2>
        <label>Name</label>
        <input id="hub-name" type="text" maxlength="18">
        <label>Optional PIN</label>
        <input id="hub-pin" type="password" inputmode="numeric" maxlength="6">
        <label>Avatar</label>
        <div id="hub-avs" class="avs"></div>
        <div class="row">
          <button class="go" type="button" onclick="hubCreate()">Start</button>
          <button class="ghost" type="button" onclick="showWhoTab('kids')">Back</button>
        </div>
      </div>
      <div id="who-parent" style="display:none">
        <h2>Household</h2>
        <p id="hub-code">—</p>
        <label>Parent email</label>
        <input id="hub-email" type="email" placeholder="you@example.com">
        <div class="row">
          <button type="button" onclick="hubSaveEmail()">Save email</button>
          <button type="button" onclick="hubEmailCode()">Email this code</button>
        </div>
        <label>Restore a family code</label>
        <input id="hub-restore" type="text" placeholder="MAPLE-K7Q2" maxlength="16" style="text-transform:uppercase">
        <div class="row">
          <button class="go" type="button" onclick="hubRestore()">Restore</button>
          <button class="ghost" type="button" onclick="showWhoTab('kids')">Back</button>
        </div>
      </div>
      <div class="row"><button class="ghost" type="button" onclick="closeWho()">Done</button></div>
    </div>
  </div>
  <div id="hub-toast"></div>
  <script src="yomple-family.js"></script>
  <script src="hub.js"></script>
</body>
</html>
