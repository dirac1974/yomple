<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yomple</title>
  <meta name="description" content="Play Bloom, Word Garden, and Hall of Presidents." />
  <link rel="icon" href="favicon.svg" />
  <style>
    :root{
      --coral:#FF6B5A; --sun:#FFD54A; --sky:#4AA8F0; --mint:#5FCFB3;
      --ink:#2B2A38; --soft:#6A6776; --paper:#FFF8F1; --line:rgba(43,42,56,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
      font-family:"ui-rounded","Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;}
    a{color:inherit}
    .wrap{width:min(860px,90vw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
      padding:28px 0 36px;}
    header{display:flex;align-items:center;justify-content:center;padding:8px 0 6px}
    .brand{display:flex;align-items:center;gap:14px;text-decoration:none}
    .mark{width:72px;height:72px;display:block}
    .word{height:42px;display:block}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:12px 0 24px}
    h1{font-size:clamp(18px,3.2vw,22px);font-weight:700;color:var(--soft);margin:0;letter-spacing:-.01em}
    .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
    .app{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:#fff;border-radius:22px;
      padding:22px 20px 20px;text-decoration:none;box-shadow:0 10px 24px rgba(43,42,56,.06);
      min-height:148px;transition:transform .15s ease}
    .app:hover{transform:translateY(-2px)}
    .app .ic{font-size:28px;line-height:1}
    .app h2{margin:0;font-size:1.15rem;letter-spacing:-.02em}
    .app p{margin:0;color:var(--soft);font-size:.92rem}
    .bloom{box-shadow:0 10px 24px rgba(95,207,179,.18)}
    .garden{box-shadow:0 10px 24px rgba(255,213,74,.22)}
    .hall{box-shadow:0 10px 24px rgba(74,168,240,.16)}
    footer{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--soft);font-size:13px;padding-top:8px}
    footer a{text-decoration:none;opacity:.75}
    footer a:hover{opacity:1}
    @media (max-width:700px){
      .apps{grid-template-columns:1fr}
      .app{min-height:0}
      .mark{width:60px;height:60px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/" aria-label="Yomple">
        <!-- Cutout mark: smiling O only, no selection frame -->
        <svg class="mark" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="40" cy="46" r="26" fill="#FFD54A"/>
          <circle cx="32" cy="42" r="4" fill="#2B2A38"/>
          <circle cx="48" cy="42" r="4" fill="#2B2A38"/>
          <path d="M32 54 q8 8 16 0" fill="none" stroke="#2B2A38" stroke-width="3" stroke-linecap="round"/>
          <circle cx="24" cy="52" r="5" fill="#FFB3A8"/>
          <circle cx="56" cy="52" r="5" fill="#FFB3A8"/>
          <line x1="34" y1="22" x2="28" y2="8" stroke="#FF6B5A" stroke-width="5" stroke-linecap="round"/>
          <circle cx="28" cy="8" r="6" fill="#FF6B5A"/>
          <line x1="46" y1="22" x2="54" y2="6" stroke="#5FCFB3" stroke-width="5" stroke-linecap="round"/>
          <circle cx="54" cy="6" r="6" fill="#5FCFB3"/>
        </svg>
        <svg class="word" viewBox="0 0 280 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="0" y="50" font-size="52" font-family="ui-rounded, Nunito, sans-serif" font-weight="800">
            <tspan fill="#FF6B5A">Y</tspan><tspan fill="#FFD54A">o</tspan><tspan fill="#4AA8F0">m</tspan><tspan fill="#5FCFB3">p</tspan><tspan fill="#FF6B5A">l</tspan><tspan fill="#4AA8F0">e</tspan>
          </text>
        </svg>
      </a>
    </header>

    <main>
      <h1>Pick a world</h1>
      <div class="apps">
        <a class="app bloom" href="https://digcgqltrlmhgmzgmvwc.supabase.co/functions/v1/bloom/">
          <span class="ic">🌱</span>
          <h2>Bloom</h2>
          <p>Multiplication</p>
        </a>
        <a class="app garden" href="https://digcgqltrlmhgmzgmvwc.supabase.co/functions/v1/word-garden/">
          <span class="ic">🌿</span>
          <h2>Word Garden</h2>
          <p>Spelling</p>
        </a>
        <a class="app hall" href="https://dirac1974.github.io/hall-of-presidents/">
          <span class="ic">🏛️</span>
          <h2>Hall of Presidents</h2>
          <p>US presidents in order</p>
        </a>
      </div>
    </main>

    <footer>
      <a href="privacy.html">Privacy</a>
      <a href="support.html">Support</a>
    </footer>
  </div>
</body>
</html>
